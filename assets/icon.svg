<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a1929"/>
      <stop offset="100%" stop-color="#04101c"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1cf5e0"/>
      <stop offset="100%" stop-color="#00b8a9"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" rx="112" ry="112" fill="url(#bg)"/>
  <!-- Subtle grid -->
  <g stroke="#0e2a44" stroke-width="1">
    <path d="M0 128 H512 M0 256 H512 M0 384 H512 M128 0 V512 M256 0 V512 M384 0 V512"/>
  </g>
  <!-- Up arrow / candle -->
  <g filter="url(#glow)">
    <path d="M96 360 L208 248 L272 312 L416 168" fill="none" stroke="url(#cyan)" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="416" cy="168" r="16" fill="#1cf5e0"/>
  </g>
  <!-- Candles -->
  <g>
    <rect x="120" y="320" width="22" height="60" rx="4" fill="#00e676"/>
    <rect x="178" y="280" width="22" height="100" rx="4" fill="#00e676"/>
    <rect x="236" y="300" width="22" height="80" rx="4" fill="#ff3b5c"/>
    <rect x="294" y="260" width="22" height="120" rx="4" fill="#00e676"/>
    <rect x="352" y="290" width="22" height="90" rx="4" fill="#00e676"/>
  </g>
  <!-- Letters OTC -->
  <text x="256" y="128" text-anchor="middle" font-family="-apple-system, Segoe UI, Roboto, sans-serif" font-weight="900" font-size="76" fill="#1cf5e0" letter-spacing="6">OTC</text>
</svg>
